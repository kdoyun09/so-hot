<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#181818;font-family:Arial,sans-serif}
#canvas-container{width:100%;height:500px;position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
#graph-panel{height:130px;background:rgba(14,20,28,.96);border-top:1px solid #3d4b58;padding:8px 12px;box-sizing:border-box;color:#eef5fb}
#graph-title{font-size:12px;font-weight:bold;margin-bottom:3px;letter-spacing:.3px}
#temp-graph{display:block;width:100%;height:94px}
#canvas-container:active{cursor:grabbing}
#canvas-container canvas{display:block;width:100%;height:100%}
#temp-display{position:absolute;top:12px;left:12px;color:#fff;background:rgba(0,0,0,.8);padding:9px 13px;border-radius:8px;font-size:15px;font-weight:bold;border:1px solid #555;z-index:5;pointer-events:none}
#photo-credit{font-family:Arial,sans-serif}\n#status{position:absolute;left:12px;bottom:10px;max-width:calc(100% - 24px);color:#eee;background:rgba(0,0,0,.72);padding:7px 10px;border-radius:6px;font-size:12px;z-index:5;pointer-events:none}
#legend{position:absolute;right:12px;top:12px;color:#eee;background:rgba(0,0,0,.76);border:1px solid #555;border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.7;z-index:5;pointer-events:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container">
  <div id="temp-display">🌡️ 음료 온도: <span id="current-temp-val">--</span> °C</div>
  <div id="legend">
    <div><span class="dot" style="background:#c4cbd1"></span>내부 용기</div>
    <div><span class="dot" style="background:#56b8d8"></span>단열층</div>
    <div><span class="dot" style="background:#4b5967"></span>외부 케이스</div>
  </div>
  <div id="status">3D 모델을 불러오는 중...</div>
</div>
<div id="graph-panel"><div id="graph-title">📈 실시간 음료 온도 변화 <span style="font-weight:normal;color:#9eabb7">— 파란 점선: 목표 온도</span></div><canvas id="temp-graph"></canvas></div>
<script>
(function(){
  const defaults={tInit:90,tEnv:20,tTarget:58,kTotal:.01,timeToTarget:60,bgTheme:"normal",innerColorHex:"0xc0c8d0",shouldStart:false,innerMaterialName:"SUS304/316L",insulationName:"진공 단열층",outerMaterialName:"파우더 코팅 메탈",drinkName:"뜨거운 커피",drinkKind:"hot",goodTempMin:50,goodTempMax:65,bodyColor:"#343e4a",surfaceFinish:"무광",lidStyle:"기본 뚜껑",showHandle:true,showStraw:false,cutaway:true};
  const config=Object.assign({},defaults,window.SO_HOT_CONFIG||{});
  const container=document.getElementById("canvas-container");
  const status=document.getElementById("status");
  const tempVal=document.getElementById("current-temp-val");
  let renderer,scene,camera,group,liquid,backgroundGlows=[];
  const graphCanvas=document.getElementById("temp-graph");
  const graphCtx=graphCanvas.getContext("2d");
  const tempHistory=[];
  let dragging=false,lastX=0,lastY=0,elapsed=0;
  let currentTemp=Number(config.tInit)||90;
  const initialTemp=currentTemp,envTemp=Number(config.tEnv)||20;
  const durationMs=4500; // 시작 후 약 4.5초 안에 목표 온도에 도달
  const innerName=String(config.innerMaterialName||"");
  const insulationName=String(config.insulationName||"");
  const outerName=String(config.outerMaterialName||"");
  const drinkName=String(config.drinkName||"뜨거운 커피");
  const drinkKind=String(config.drinkKind||"hot");
  const goodMin=Number(config.goodTempMin??50);
  const goodMax=Number(config.goodTempMax??65);
  tempVal.textContent=currentTemp.toFixed(1);

  function fail(message){status.textContent="3D 화면 오류: "+message;status.style.color="#ffb4b4";}
  function standard(color,roughness,metalness,extra){return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:roughness,metalness:metalness,side:THREE.DoubleSide},extra||{}));}
  function addMesh(geometry,material,y){const mesh=new THREE.Mesh(geometry,material);mesh.position.y=y||0;group.add(mesh);return mesh;}
  function halfCylinder(rt,rb,h,start,arc,material,y){return addMesh(new THREE.CylinderGeometry(rt,rb,h,64,1,false,start,arc),material,y||0);}
  function ring(radius,tube,y,color,metalness){
    const mesh=new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,64),standard(color,.28,metalness||0));
    mesh.rotation.x=Math.PI/2;mesh.position.y=y;group.add(mesh);return mesh;
  }
  function init(){
    if(!window.THREE){fail("Three.js를 불러오지 못했습니다. 네트워크 또는 CDN 접근을 확인해 주세요.");return;}
    try{
      scene=new THREE.Scene();
      let bg=0x181b20,gridColor=0x46505b,seasonGlow=0x5fbd91;
      if(config.bgTheme==="spring"){bg=0x17251f;gridColor=0x4d8064;seasonGlow=0x70e0a1;}
      if(config.bgTheme==="summer"){bg=0x282018;gridColor=0x947044;seasonGlow=0xffbd68;}
      if(config.bgTheme==="autumn"){bg=0x291b17;gridColor=0x8b5940;seasonGlow=0xff8659;}
      if(config.bgTheme==="winter"){bg=0x0a1622;gridColor=0x3377aa;seasonGlow=0x68caff;}
      scene.background=new THREE.Color(bg);
      // 한국의 실제 사계절 풍경 사진을 배경 텍스처로 사용합니다.
      // Wikimedia Commons의 공개 라이선스 사진이며, 화면에 사진 출처를 함께 표시합니다.
      const seasonPhotos={
        spring:{
          url:"https://commons.wikimedia.org/wiki/Special:FilePath/Mangyeongdae_Terrace_of_Bukhansan_in_Spring_in_Korea.jpg?width=1600",
          credit:"봄 사진: Jo Hanshin · Wikimedia Commons · CC0"
        },
        summer:{
          url:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Bukhansan_Summer_in_Korea.jpg",
          credit:"여름 사진: Jo Hanshin · Wikimedia Commons · CC0"
        },
        autumn:{
          url:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Autumn_in_Chiak_Mountain.jpg",
          credit:"가을 사진: Sohyeon Bak · Wikimedia Commons · CC BY-SA 3.0"
        },
        winter:{
          url:"https://commons.wikimedia.org/wiki/Special:Redirect/file/%EB%88%88%EB%82%B4%EB%A6%B0_%EC%84%A4%EC%95%85%EC%82%B0_%ED%92%8D%EA%B2%BD.jpg",
          credit:"겨울 사진: Sohyeon Bak · Wikimedia Commons · CC BY-SA 3.0"
        }
      };
      const selectedSeasonPhoto=seasonPhotos[config.bgTheme]||seasonPhotos.spring;
      let photoCredit=document.getElementById("photo-credit");
      if(!photoCredit){
        photoCredit=document.createElement("div");
        photoCredit.id="photo-credit";
        photoCredit.style.cssText="position:absolute;right:10px;bottom:10px;max-width:55%;padding:5px 7px;border-radius:5px;background:rgba(0,0,0,.62);color:#e8edf2;font:10px Arial,sans-serif;text-align:right;z-index:4;pointer-events:none";
        container.appendChild(photoCredit);
      }
      photoCredit.textContent=selectedSeasonPhoto.credit;
      const seasonBackdropMaterial=new THREE.MeshBasicMaterial({color:0xffffff,depthWrite:false,side:THREE.DoubleSide});
      const seasonBackdrop=new THREE.Mesh(new THREE.PlaneGeometry(12.5,7.3),seasonBackdropMaterial);
      seasonBackdrop.position.set(0,0,-4.8);seasonBackdrop.renderOrder=-2;scene.add(seasonBackdrop);
      const seasonLoader=new THREE.TextureLoader();
      seasonLoader.setCrossOrigin("anonymous");
      seasonLoader.load(selectedSeasonPhoto.url,(texture)=>{
        texture.encoding=THREE.sRGBEncoding;
        texture.minFilter=THREE.LinearFilter;
        seasonBackdrop.material.map=texture;
        seasonBackdrop.material.color.set(0xffffff);
        seasonBackdrop.material.needsUpdate=true;
      },undefined,(error)=>{
        console.warn("계절 사진을 불러오지 못했습니다. 계절 일러스트 배경을 표시합니다.",error);
        const cv=document.createElement("canvas");cv.width=1200;cv.height=700;
        const cx=cv.getContext("2d"),g=cx.createLinearGradient(0,0,0,700);
        const p={spring:["#b9e5ed","#f5e7ed"],summer:["#67c9f2","#ffe19a"],autumn:["#d98b53","#f3c18a"],winter:["#a8c8df","#f4f8fc"]};
        const a=p[config.bgTheme]||p.spring;g.addColorStop(0,a[0]);g.addColorStop(1,a[1]);cx.fillStyle=g;cx.fillRect(0,0,1200,700);
        cx.fillStyle=config.bgTheme==="winter"?"#edf4f8":config.bgTheme==="autumn"?"#81533a":"#527b62";
        cx.beginPath();cx.moveTo(0,470);cx.lineTo(230,260);cx.lineTo(420,440);cx.lineTo(650,230);cx.lineTo(900,450);cx.lineTo(1080,290);cx.lineTo(1200,420);cx.lineTo(1200,700);cx.lineTo(0,700);cx.fill();
        if(config.bgTheme==="winter"){cx.fillStyle="#fff";for(let i=0;i<220;i++){cx.beginPath();cx.arc((i*83)%1200,(i*47)%680,2+(i%3),0,Math.PI*2);cx.fill();}}
        if(config.bgTheme==="autumn"){for(let i=0;i<110;i++){cx.fillStyle=["#c65d2e","#e9a33a","#9b3f25"][i%3];cx.beginPath();cx.ellipse((i*137)%1200,350+(i*71)%300,9,4,i*.4,0,Math.PI*2);cx.fill();}}
        if(config.bgTheme==="spring"){for(let i=0;i<80;i++){cx.fillStyle="#f6c9dc";cx.beginPath();cx.arc((i*149)%1200,280+(i*53)%280,7,0,Math.PI*2);cx.fill();}}
        if(config.bgTheme==="summer"){cx.fillStyle="#fff2a6";cx.beginPath();cx.arc(980,120,70,0,Math.PI*2);cx.fill();}
        const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;seasonBackdrop.material.map=tx;seasonBackdrop.material.needsUpdate=true;
      });
      // 배경의 오로라 색 번짐은 풍경을 가리지 않도록 아주 은은하게 유지합니다.
      const glowCanvas=document.createElement("canvas");
      glowCanvas.width=512;glowCanvas.height=512;
      const glowCtx=glowCanvas.getContext("2d");
      const glowGradient=glowCtx.createRadialGradient(256,256,12,256,256,250);
      glowGradient.addColorStop(0,"rgba(255,255,255,0.78)");
      glowGradient.addColorStop(.35,"rgba(255,255,255,0.36)");
      glowGradient.addColorStop(1,"rgba(255,255,255,0)");
      glowCtx.fillStyle=glowGradient;glowCtx.fillRect(0,0,512,512);
      const glowTexture=new THREE.CanvasTexture(glowCanvas);
      const glowSpecs=[[-1.7,.55,4.6,4.8],[1.65,-.35,4.8,4.6],[0,1.25,5.5,3.7]];
      glowSpecs.forEach(([x,y,w,h])=>{
        const glow=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
          new THREE.MeshBasicMaterial({map:glowTexture,color:seasonGlow,transparent:true,opacity:.055,
            blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
        glow.position.set(x,y,-3.1);glow.renderOrder=-1;scene.add(glow);backgroundGlows.push(glow);
      });
      const width=Math.max(container.clientWidth,320);
      camera=new THREE.PerspectiveCamera(39,width/500,.1,100);
      camera.position.set(0,.35,7.4);camera.lookAt(0,0,0);
      renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(width,500);
      renderer.outputEncoding=THREE.sRGBEncoding;
      container.insertBefore(renderer.domElement,container.firstChild);
      scene.add(new THREE.AmbientLight(0xffffff,1.05));
      const keyLight=new THREE.DirectionalLight(0xffffff,2.2);keyLight.position.set(4,7,6);scene.add(keyLight);
      const fillLight=new THREE.DirectionalLight(0x8fcfff,.75);fillLight.position.set(-4,2,3);scene.add(fillLight);
      const rimLight=new THREE.DirectionalLight(0xffd4a1,.7);rimLight.position.set(-3,4,-5);scene.add(rimLight);
      const grid=new THREE.GridHelper(10,20,gridColor,0x303943);grid.position.y=-2.08;scene.add(grid);
      group=new THREE.Group();group.rotation.y=-.48;scene.add(group);

      // 1) Inner vessel: material choice changes both color and surface finish.
      let innerMat;
      if(innerName.includes("세라믹")){
        innerMat=standard(0xf1eee4,.68,0.02);
      }else if(innerName.includes("유리")){
        innerMat=standard(0x7fcde8,.12,.05,{transparent:true,opacity:.58,depthWrite:false});
      }else{
        innerMat=standard(0xc5cbd1,.2,.88);
      }
      halfCylinder(.82,.69,2.83,0,config.cutaway?Math.PI:Math.PI*2,innerMat,-.02);
      // Inner lip and bottom rim make the mouth and wall thickness visible.
      ring(.84,.055,1.43,innerName.includes("세라믹")?0xf1eee4:innerName.includes("유리")?0x7fcde8:0xe0e5e9,innerName.includes("유리")?0:.75);
      ring(.70,.045,-1.43,0x9da7b0,.55);

      // 2) Insulation cross-section: each choice gets a distinctive visual language.
      if(insulationName.includes("진공")){
        // Vacuum gap: dark, nearly empty annulus with reflective blue inner edges.
        halfCylinder(.965,.835,2.65,0,config.cutaway?Math.PI:Math.PI*2,standard(0x102b3a,.18,.15,{transparent:true,opacity:config.cutaway?.42:.18,depthWrite:false}),0);
        for(let y=-1.08;y<=1.08;y+=1.08){ ring(.89,.008,y,0x3b9eb9,.35); }
        status.textContent="진공 단열층: 비어 있는 간격과 금속 반사층을 표시 · 드래그해 회전";
      }else if(insulationName.includes("에어로겔")){
        halfCylinder(.965,.835,2.65,0,config.cutaway?Math.PI:Math.PI*2,standard(0x3f91a9,.9,0,{transparent:true,opacity:config.cutaway?.78:.22}),0);
        // Aerogel's porous texture is represented by many tiny pale-blue beads.
        const beadMat=new THREE.MeshStandardMaterial({color:0xb7edf4,roughness:1,metalness:0});
        for(let row=0;row<9;row++){
          const y=-1.18+row*.29;
          for(let i=0;i<15;i++){
            const theta=.10+i*(Math.PI-.20)/14;
            const r=.89+((row+i)%3)*.018;
            const bead=new THREE.Mesh(new THREE.SphereGeometry(.025+((i+row)%3)*.006,7,6),beadMat);
            bead.position.set(Math.sin(theta)*r,y,Math.cos(theta)*r);
            group.add(bead);
          }
        }
        status.textContent="에어로겔: 다공성 입자 질감을 표현 · 드래그해 회전";
      }else{
        halfCylinder(.965,.835,2.65,0,config.cutaway?Math.PI:Math.PI*2,standard(0xd6a56d,.95,0,{transparent:!config.cutaway,opacity:config.cutaway?1:.25}),0);
        // Foam texture: shallow raised bands distinguish it from vacuum/aerogel.
        for(let y=-1.10;y<=1.11;y+=.34){halfCylinder(.972,.842,.035,0,Math.PI,standard(0xf0c991,.98,0),y);}
        status.textContent="우레탄 폼: 두툼한 발포 단열층을 표현 · 드래그해 회전";
      }

      // 3) Outer casing: coating, silicone grip, and plastic are visibly different.
      const finishRoughness=config.surfaceFinish==="유광"?.12:config.surfaceFinish==="메탈릭"?.28:.72;
      const finishMetalness=config.surfaceFinish==="메탈릭"?.72:.12;
      const selectedBodyColor=new THREE.Color(config.bodyColor||"#343e4a");
      // 단면 보기에서는 외장 뒷면이 내부 구조 위로 겹쳐 보이지 않도록
      // 외장 원기둥을 숨기고 상단·하단 테두리로 가장 바깥 경계만 표시합니다.
      // 단면을 끄면 기존처럼 반투명한 전체 외장을 표시합니다.
      if(config.cutaway){
        const outerMaterial=standard(selectedBodyColor,finishRoughness,finishMetalness,{transparent:true,opacity:.92,depthWrite:true});
        halfCylinder(1.035,.91,3.03,Math.PI,Math.PI,outerMaterial,.0);
      }else{
        // 단면 보기를 끄면 내부 구조가 비치지 않도록 외장 케이스를 불투명하게 표시합니다.
        // 선택한 외부 색상(예: 로즈 핑크)이 텀블러 전체 표면을 채우도록 설정합니다.
        const outerMaterial=standard(selectedBodyColor,finishRoughness,finishMetalness,{transparent:false,opacity:1,depthWrite:true});
        halfCylinder(1.035,.91,3.03,0,Math.PI*2,outerMaterial,.0);
      }
      if(outerName.includes("실리콘")){
        for(let y=-1.18;y<=1.20;y+=.17){halfCylinder(1.043,.918,.035,Math.PI,Math.PI,standard(0x0e666b,.95,0),y);}
        // Soft silicone grip pads on the front-facing side.
        for(let row=0;row<5;row++)for(let col=0;col<3;col++){
          const x=-.35+col*.35,y=-.72+row*.36;
          const pad=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),standard(0x36a4a4,.92,0));
          pad.scale.set(1,.65,.35);pad.position.set(x,y,.99);group.add(pad);
        }
      }else if(outerName.includes("플라스틱")){
        ring(1.04,.025,1.48,0x91d8f3,.05);ring(1.04,.025,-1.48,0x91d8f3,.05);
      }else{
        ring(1.04,.035,1.48,0x7e8b98,.7);ring(1.04,.035,-1.48,0x202a34,.65);
      }

      // 4) Lid, drinking opening, threaded-looking rim and base.
      const lidMat=standard(config.lidStyle==="원터치 뚜껑"?0x303b48:0x242b32,.36,.38);
      addMesh(new THREE.CylinderGeometry(1.045,1.045,.25,64),lidMat,1.58);
      if(config.lidStyle==="원터치 뚜껑"){
        addMesh(new THREE.BoxGeometry(.58,.12,.42),standard(0x566575,.3,.45),1.77);
        addMesh(new THREE.CylinderGeometry(.16,.16,.06,32),standard(0x9aa8b5,.25,.55),1.86);
      }else{
        addMesh(new THREE.CylinderGeometry(.48,.48,.075,48),standard(0x15191e,.3,.2),1.745);
        ring(.50,.025,1.79,0x707b84,.6);
      }
      if(config.lidStyle==="빨대 뚜껑") config.showStraw=true;
      for(let y=1.48;y<=1.56;y+=.025)ring(1.045,.009,y,0x66717b,.45);
      addMesh(new THREE.CylinderGeometry(.89,.89,.12,64),standard(0x242a31,.3,.45),-1.52);

      // 5) Handle with a thicker connector to the body.
      if(config.showHandle!==false){
        const handleMat=standard(selectedBodyColor,finishRoughness,finishMetalness);
        const handle=new THREE.Mesh(new THREE.TorusGeometry(.58,.105,16,64,Math.PI*1.55),handleMat);
        handle.position.set(-1.30,.0,.02);handle.rotation.z=Math.PI/2;group.add(handle);
        for(const y of [-.28,.28]){
          const connector=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.22,24),handleMat);
          connector.rotation.z=Math.PI/2;connector.position.set(-.98,y,0);group.add(connector);
        }
      }
      if(config.showStraw){
        const straw=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.95,20),standard(0xeaf7ff,.22,.05));
        straw.position.set(.25,2.20,.12);straw.rotation.z=-.08;group.add(straw);
        const strawTop=new THREE.Mesh(new THREE.TorusGeometry(.045,.012,8,20),standard(0x8bd7ef,.2,.1));
        strawTop.position.set(.25,2.68,.12);strawTop.rotation.x=Math.PI/2;group.add(strawTop);
      }

      // 6) 음료 종류에 따라 액체와 표면 색상을 구분합니다.
      const drinkPalette={
        "뜨거운 커피":{liquid:0x75401f,surface:0x9b6035},
        "아이스 커피":{liquid:0x5b321f,surface:0x8a5838},
        "차(녹차·홍차)":{liquid:0x9b7830,surface:0xc5a64f},
        "아이스티":{liquid:0xb85b20,surface:0xe18a3c},
        "물":{liquid:0x8fd8ed,surface:0xc8f2ff},
        "라떼·우유":{liquid:0xd9c49a,surface:0xf0dfbd},
        "스포츠음료":{liquid:0xe98a32,surface:0xffc35c}
      };
      const selectedDrink=drinkPalette[drinkName]||drinkPalette["뜨거운 커피"];
      liquid=addMesh(new THREE.CylinderGeometry(.68,.60,2.25,64),new THREE.MeshStandardMaterial({color:selectedDrink.liquid,roughness:.22,side:THREE.DoubleSide}),-.18);
      const surface=new THREE.Mesh(new THREE.CircleGeometry(.67,48),new THREE.MeshStandardMaterial({color:selectedDrink.surface,roughness:.22,side:THREE.DoubleSide}));
      surface.rotation.x=-Math.PI/2;surface.position.y=.96;group.add(surface);
      // 컵 주변에는 오로라를 표시하지 않습니다. 색 효과는 배경에서만 나타납니다.

      window.addEventListener("resize",resize);
      container.addEventListener("pointerdown",onDown);
      window.addEventListener("pointermove",onMove);
      window.addEventListener("pointerup",onUp);
      resize();
      tempHistory.push({time:0,temp:currentTemp});
      drawGraph();
      animate();
    }catch(err){console.error(err);fail(err&&err.message?err.message:"WebGL 초기화에 실패했습니다.");}
  }
  function resize(){
    if(!renderer||!camera)return;
    const w=Math.max(container.clientWidth,320);
    renderer.setSize(w,500);camera.aspect=w/500;camera.updateProjectionMatrix();
    const dpr=Math.min(window.devicePixelRatio||1,2);
    graphCanvas.width=Math.max(320,graphCanvas.clientWidth)*dpr;
    graphCanvas.height=graphCanvas.clientHeight*dpr;
    graphCtx.setTransform(dpr,0,0,dpr,0,0);
    drawGraph();
  }
  function drawGraph(){
    if(!graphCtx)return;
    const w=graphCanvas.clientWidth||320,h=graphCanvas.clientHeight||94;
    graphCtx.clearRect(0,0,w,h);
    const values=[initialTemp,Number(config.tTarget),Number(config.tEnv),...tempHistory.map(p=>p.temp)];
    let min=Math.min(...values)-5,max=Math.max(...values)+5;
    if(max-min<10){max+=5;min-=5;}
    const x0=34,x1=w-12,y0=8,y1=h-18;
    const X=t=>x0+(x1-x0)*(t/durationMs);
    const Y=v=>y1-(v-min)/(max-min)*(y1-y0);
    graphCtx.strokeStyle="rgba(255,255,255,.13)";graphCtx.lineWidth=1;
    for(let n=0;n<4;n++){const y=y0+(y1-y0)*n/3;graphCtx.beginPath();graphCtx.moveTo(x0,y);graphCtx.lineTo(x1,y);graphCtx.stroke();}
    graphCtx.fillStyle="#aebbc8";graphCtx.font="10px Arial";
    graphCtx.fillText(max.toFixed(0)+"°",2,y0+4);graphCtx.fillText(min.toFixed(0)+"°",2,y1+3);
    graphCtx.setLineDash([4,4]);graphCtx.strokeStyle="#65b8ff";graphCtx.beginPath();graphCtx.moveTo(x0,Y(Number(config.tTarget)));graphCtx.lineTo(x1,Y(Number(config.tTarget)));graphCtx.stroke();graphCtx.setLineDash([]);
    graphCtx.strokeStyle="#ffb45c";graphCtx.lineWidth=2.5;graphCtx.beginPath();
    if(tempHistory.length===0){graphCtx.moveTo(x0,Y(initialTemp));graphCtx.lineTo(x1,Y(initialTemp));}
    else{
      const pts=tempHistory.map(p=>({x:X(p.time),y:Y(p.temp)}));
      graphCtx.moveTo(pts[0].x,pts[0].y);
      if(pts.length===2)graphCtx.lineTo(pts[1].x,pts[1].y);
      else{
        for(let j=1;j<pts.length-1;j++){
          const midX=(pts[j].x+pts[j+1].x)/2;
          const midY=(pts[j].y+pts[j+1].y)/2;
          graphCtx.quadraticCurveTo(pts[j].x,pts[j].y,midX,midY);
        }
        const last=pts[pts.length-1];
        graphCtx.lineTo(last.x,last.y);
      }
    }
    graphCtx.stroke();
    graphCtx.fillStyle="#eaf2f8";graphCtx.fillText("0초",x0,y1+13);graphCtx.fillText("4.5초",x1-30,y1+13);
  }
  function onDown(e){
    dragging=true;lastX=e.clientX;lastY=e.clientY;
    if(container.setPointerCapture)container.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if(!dragging||!group)return;
    // 위아래 회전 제한을 없애 상단·하단까지 360도 자유롭게 관찰할 수 있습니다.
    group.rotation.y+=(e.clientX-lastX)*.01;
    group.rotation.x+=(e.clientY-lastY)*.01;
    lastX=e.clientX;lastY=e.clientY;
  }
  function onUp(){dragging=false;}
  function animate(){
    requestAnimationFrame(animate);
    if(!scene||!renderer)return;
    // 자동 회전을 끄고 사용자가 원하는 각도에서 멈춰 자세히 볼 수 있게 합니다.
    if(config.shouldStart){
      elapsed=Math.min(elapsed+16,durationMs);
      const ratio=elapsed/durationMs;
      // 텀블러 단열 성능(kTotal)과 재질 조합에 따라 변화 곡선을 조금씩 다르게 표현합니다.
      const insulationFactor=Math.max(.75,Math.min(1.25,Number(config.kTotal||.01)/.01));
      const curveStrength=3.0/insulationFactor;
      const eased=(1-Math.exp(-curveStrength*ratio))/(1-Math.exp(-curveStrength));
      currentTemp=initialTemp+(Number(config.tTarget)-initialTemp)*eased;
      if(elapsed>=durationMs)currentTemp=Number(config.tTarget);
      tempVal.textContent=currentTemp.toFixed(1);
      tempHistory.push({time:elapsed,temp:currentTemp});
      if(tempHistory.length>600)tempHistory.shift();
      drawGraph();

      // 음료별 권장 온도 범위에 따라 빨강(너무 뜨거움/미지근함), 초록(적정), 파랑(너무 식음/차가움)으로 부드럽게 전환합니다.
      let targetColor;
      let temperatureLabel;
      if(currentTemp>goodMax){
        targetColor=new THREE.Color(0xff3328);
        temperatureLabel=drinkKind==="cold"?"아직 충분히 차갑지 않아요":"너무 뜨거워요";
      }else if(currentTemp<goodMin){
        targetColor=new THREE.Color(0x338dff);
        temperatureLabel=drinkKind==="cold"?"너무 차가워요":"식어서 아쉬워요";
      }else{
        targetColor=new THREE.Color(0x28e878);
        temperatureLabel="먹기 좋은 온도예요";
      }
      // 온도 상태에 따라 배경 오로라 색만 부드럽게 바꿉니다.
      const pulse=1+Math.sin(elapsed*.003)*.035;
      backgroundGlows.forEach((glow,i)=>{
        glow.material.color.lerp(targetColor,.045);
        glow.material.opacity=(i===2?.12:.17)*pulse;
      });
      status.textContent=drinkName+" · "+temperatureLabel+" · 드래그해 회전";
      if(elapsed>=durationMs){
        status.textContent=drinkName+" · "+temperatureLabel+" · 목표 온도 도달";
        config.shouldStart=false;
      }
    }
    renderer.render(scene,camera);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
