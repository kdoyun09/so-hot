<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#181818;font-family:Arial,sans-serif}
#canvas-container{width:100%;height:480px;position:relative;overflow:hidden;cursor:grab}
#canvas-container:active{cursor:grabbing}
#canvas-container canvas{display:block;width:100%;height:100%}
#temp-display{position:absolute;top:12px;left:12px;color:#fff;background:rgba(0,0,0,.78);padding:9px 13px;border-radius:8px;font-size:16px;font-weight:bold;border:1px solid #555;z-index:5;pointer-events:none}
#status{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 48px);color:#eee;background:rgba(0,0,0,.7);padding:7px 10px;border-radius:6px;font-size:12px;z-index:5}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container">
  <div id="temp-display">🌡️ 실시간 온도: <span id="current-temp-val">--</span> °C</div>
  <div id="status">3D 모델을 불러오는 중...</div>
</div>
<script>
(function(){
  const defaults={tInit:90,tEnv:20,tTarget:58,kTotal:.01,timeToTarget:60,bgTheme:"normal",innerColorHex:"0xc0c8d0",shouldStart:false};
  const config=Object.assign({},defaults,window.SO_HOT_CONFIG||{});
  const container=document.getElementById("canvas-container");
  const status=document.getElementById("status");
  const tempVal=document.getElementById("current-temp-val");
  let renderer,scene,camera,group,liquid,aura;
  let dragging=false,lastX=0,lastY=0,elapsed=0;
  let currentTemp=Number(config.tInit)||90;
  const initialTemp=currentTemp,envTemp=Number(config.tEnv)||20;
  const durationMs=Math.max(8000,Math.min(45000,(Number(config.timeToTarget)||60)*500));
  tempVal.textContent=currentTemp.toFixed(1);
  function fail(message){status.textContent="3D 화면 오류: "+message;status.style.color="#ffb4b4";}
  function mat(color,roughness=.5,metalness=0,extra={}){return new THREE.MeshStandardMaterial(Object.assign({color,roughness,metalness,side:THREE.DoubleSide},extra));}
  function addMesh(geometry,material,y=0){const m=new THREE.Mesh(geometry,material);m.position.y=y;group.add(m);return m;}
  function init(){
    if(!window.THREE){fail("Three.js를 불러오지 못했습니다. 네트워크 또는 CDN 접근을 확인해 주세요.");return;}
    try{
      scene=new THREE.Scene();
      let bg=0x181818,gridColor=0x444444;
      if(config.bgTheme==="summer"){bg=0x2b1c0c;gridColor=0x885522;}
      if(config.bgTheme==="winter"){bg=0x0a1622;gridColor=0x3377aa;}
      scene.background=new THREE.Color(bg);
      const width=Math.max(container.clientWidth,320);
      camera=new THREE.PerspectiveCamera(42,width/480,.1,100);
      camera.position.set(0,.45,7.2);camera.lookAt(0,0,0);
      renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
      renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
      renderer.setSize(width,480);
      renderer.outputEncoding=THREE.sRGBEncoding;
      container.insertBefore(renderer.domElement,container.firstChild);
      scene.add(new THREE.AmbientLight(0xffffff,1.25));
      const keyLight=new THREE.DirectionalLight(0xffffff,2);keyLight.position.set(4,7,6);scene.add(keyLight);
      const rimLight=new THREE.DirectionalLight(0x8fcfff,.8);rimLight.position.set(-4,2,-4);scene.add(rimLight);
      const grid=new THREE.GridHelper(10,20,gridColor,0x333333);grid.position.y=-2.05;scene.add(grid);
      group=new THREE.Group();group.rotation.y=-.45;scene.add(group);
      addMesh(new THREE.CylinderGeometry(.92,.76,3,48,1,false,0,Math.PI),mat(0x424a52,.35,.45));
      addMesh(new THREE.CylinderGeometry(.92,.76,3,48,1,false,Math.PI,Math.PI),mat(0x91b7c9,.25,.15,{transparent:true,opacity:.34,depthWrite:false}));
      const raw=String(config.innerColorHex||"0xc0c8d0").replace(/^0x/i,"");
      addMesh(new THREE.CylinderGeometry(.81,.67,2.78,48,1,false,0,Math.PI),mat(parseInt(raw,16)||0xc0c8d0,.24,.65));
      addMesh(new THREE.CylinderGeometry(.77,.77,.12,48),mat(0x252a30,.4,.35),-1.48);
      addMesh(new THREE.CylinderGeometry(.94,.94,.28,48),mat(0x24282d,.35,.25),1.62);
      addMesh(new THREE.CylinderGeometry(.65,.65,.06,48),mat(0x111418,.3,.2),1.79);
      const handle=new THREE.Mesh(new THREE.TorusGeometry(.66,.085,14,40,Math.PI*1.15),mat(0x252a30,.4,.25));
      handle.position.set(-1.05,.05,0);handle.rotation.z=Math.PI/2;group.add(handle);
      liquid=addMesh(new THREE.CylinderGeometry(.72,.60,2.38,48),new THREE.MeshStandardMaterial({color:0x9a5725,roughness:.22,side:THREE.DoubleSide,transparent:true,opacity:.92}),-.20);
      aura=new THREE.Mesh(new THREE.CylinderGeometry(1.02,.88,3.15,48,1,true),new THREE.MeshBasicMaterial({color:0xff5522,transparent:true,opacity:.08,side:THREE.DoubleSide}));
      aura.position.y=.02;group.add(aura);
      status.textContent=config.shouldStart?"시뮬레이션 실행 중 · 드래그해 회전":"준비 완료 · 마우스로 드래그해 텀블러를 회전";
      window.addEventListener("resize",resize);
      container.addEventListener("pointerdown",onDown);
      window.addEventListener("pointermove",onMove);
      window.addEventListener("pointerup",onUp);
      animate();
    }catch(err){console.error(err);fail(err&&err.message?err.message:"WebGL 초기화에 실패했습니다.");}
  }
  function resize(){if(!renderer||!camera)return;const w=Math.max(container.clientWidth,320);renderer.setSize(w,480);camera.aspect=w/480;camera.updateProjectionMatrix();}
  function onDown(e){dragging=true;lastX=e.clientX;lastY=e.clientY;}
  function onMove(e){if(!dragging||!group)return;group.rotation.y+=(e.clientX-lastX)*.01;group.rotation.x=Math.max(-.35,Math.min(.35,group.rotation.x+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY;}
  function onUp(){dragging=false;}
  function animate(){
    requestAnimationFrame(animate);
    if(!scene||!renderer)return;
    if(!dragging&&group)group.rotation.y+=.0018;
    if(config.shouldStart){
      elapsed=Math.min(elapsed+16,durationMs);
      const ratio=elapsed/durationMs;
      const targetRatio=Math.max((Number(config.tTarget)-envTemp)/(initialTemp-envTemp||1),.001);
      currentTemp=envTemp+(initialTemp-envTemp)*Math.exp(-Math.log(targetRatio)*ratio);
      if(elapsed>=durationMs)currentTemp=Number(config.tTarget);
      tempVal.textContent=currentTemp.toFixed(1);
      aura.material.opacity=.04+.10*Math.max(0,(currentTemp-envTemp)/(initialTemp-envTemp||1));
      if(elapsed>=durationMs){status.textContent="목표 온도 도달";config.shouldStart=false;}
    }
    renderer.render(scene,camera);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
</body>
</html>
