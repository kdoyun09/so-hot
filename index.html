\<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 480px; position: relative; display: flex; justify-content: center; align-items: center; }
        #simCanvas { width: 100%; height: 480px; cursor: grab; }
        #simCanvas:active { cursor: grabbing; }
        #temp-display {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0, 0, 0, 0.8); padding: 10px 16px; border-radius: 8px;
            font-size: 18px; font-weight: bold; border: 1px solid #555; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div id="temp-display">🌡️ 실시간 온도: <span id="current-temp-val">90.0</span> °C</div>
        <canvas id="simCanvas"></canvas>
    </div>
    <script>
        window.addEventListener("DOMContentLoaded", function() {
            setTimeout(initApp, 30);
        });

        function initApp() {
            const dataElem = document.getElementById("sim-data");
            let config = { tInit: 90.0, tEnv: 20.0, tTarget: 58.0, kTotal: 0.01, timeToTarget: 60.0, bgTheme: "normal", innerColorHex: "0xc0c8d0", shouldStart: false };

            if (dataElem && dataElem.innerText) {
                try { config = JSON.parse(dataElem.innerText); } catch(e) {}
            }

            const tempValElem = document.getElementById("current-temp-val");
            if (config && config.tInit) tempValElem.innerText = Number(config.tInit).toFixed(1);

            const canvas = document.getElementById("simCanvas");
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = canvas.parentElement.clientWidth || 600;
                canvas.height = 480;
            }
            resize();
            window.addEventListener("resize", resize);

            let rotY = 0.3;
            let rotX = 0.2;
            let isDragging = false;
            let prevX = 0, prevY = 0;

            canvas.addEventListener("mousedown", (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
            window.addEventListener("mousemove", (e) => {
                if (isDragging) {
                    rotY += (e.clientX - prevX) * 0.01;
                    rotX += (e.clientY - prevY) * 0.01;
                    prevX = e.clientX; prevY = e.clientY;
                }
            });
            window.addEventListener("mouseup", () => { isDragging = false; });

            let currentTemp = config.tInit;
            let progress = 0;
            const totalSteps = 150;

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const cx = canvas.width / 2;
                const cy = canvas.height / 2 + 20;

                // 배경 그라데이션
                let bgGrad = ctx.createRadialGradient(cx, cy, 50, cx, cy, 300);
                if (config.bgTheme === "summer") {
                    bgGrad.addColorStop(0, "#3a2010"); bgGrad.addColorStop(1, "#110a05");
                } else if (config.bgTheme === "winter") {
                    bgGrad.addColorStop(0, "#10253a"); bgGrad.addColorStop(1, "#050a11");
                } else {
                    bgGrad.addColorStop(0, "#22252a"); bgGrad.addColorStop(1, "#0a0b0d");
                }
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (!isDragging) rotY += 0.008;

                // 아우라 색상 연출
                let auraColor = "rgba(255, 60, 60, 0.3)";
                if (currentTemp < 50) auraColor = "rgba(60, 160, 255, 0.3)";
                else if (currentTemp < 65) auraColor = "rgba(60, 255, 120, 0.3)";

                // 텀블러 아우라 Glow
                ctx.beginPath();
                ctx.ellipse(cx, cy, 95, 165, 0, 0, Math.PI * 2);
                ctx.fillStyle = auraColor;
                ctx.fill();

                // 1. 텀블러 외벽 (반단면 3D 연출)
                ctx.save();
                ctx.translate(cx, cy);

                // 외벽 바디
                let bodyGrad = ctx.createLinearGradient(-75, 0, 75, 0);
                bodyGrad.addColorStop(0, "#444");
                bodyGrad.addColorStop(0.5, "#888");
                bodyGrad.addColorStop(1, "#222");

                ctx.beginPath();
                ctx.roundRect(-75, -130, 150, 260, [10, 10, 20, 20]);
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.strokeStyle = "#aaa";
                ctx.lineWidth = 2;
                ctx.stroke();

                // 2. 단열층 & 내벽 (반단면 세로 컷 cutout)
                ctx.beginPath();
                ctx.rect(0, -120, 65, 240);
                let innerHex = config.innerColorHex ? "#" + config.innerColorHex.replace("0x", "") : "#c0c8d0";
                ctx.fillStyle = innerHex;
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 3. 내부 음료
                ctx.beginPath();
                ctx.rect(5, -100, 55, 215);
                ctx.fillStyle = "#5d3a1a";
                ctx.fill();

                // 4. 텀블러 뚜껑 & 손잡이
                ctx.beginPath();
                ctx.roundRect(-80, -155, 160, 25, 5);
                ctx.fillStyle = "#1a1a1a";
                ctx.fill();

                ctx.beginPath();
                ctx.arc(-80, 0, 35, -Math.PI / 2, Math.PI / 2);
                ctx.lineWidth = 12;
                ctx.strokeStyle = "#222";
                ctx.stroke();

                ctx.restore();

                // 시뮬레이션 온도 감소 연산
                if (config.shouldStart && progress <= totalSteps) {
                    let progressRatio = progress / totalSteps;
                    let timeVal = progressRatio * config.timeToTarget;
                    currentTemp = config.tEnv + (config.tInit - config.tEnv) * Math.exp(-config.kTotal * timeVal);
                    tempValElem.innerText = currentTemp.toFixed(1);
                    progress++;
                }

                requestAnimationFrame(draw);
            }

            draw();
        }
    </script>
</body>
</html>
