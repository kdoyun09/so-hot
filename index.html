<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 480px; position: relative; }
        #temp-display {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0, 0, 0, 0.75); padding: 10px 16px; border-radius: 8px;
            font-size: 18px; font-weight: bold; border: 1px solid #444; z-index: 10;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <div id="temp-display">🌡️ 실시간 온도: <span id="current-temp-val">--</span> °C</div>
    </div>
    <script>
        let isRendered = false;

        function run3DSimulator() {
            if (isRendered) return;

            const dataElem = document.getElementById("sim-data");
            let config = { tInit: 90.0, tEnv: 20.0, tTarget: 58.0, kTotal: 0.01, timeToTarget: 60.0, bgTheme: "normal", innerColorHex: "0xc0c8d0", shouldStart: false };
            
            if (dataElem && dataElem.innerText) {
                try {
                    config = JSON.parse(dataElem.innerText);
                } catch(e) {}
            }

            const container = document.getElementById("canvas-container");
            const tempValElem = document.getElementById("current-temp-val");
            
            if (!container || typeof THREE === "undefined") return;

            isRendered = true;

            if (config && config.tInit !== undefined) {
                tempValElem.innerText = Number(config.tInit).toFixed(1);
            }

            container.innerHTML = '<div id="temp-display">🌡️ 실시간 온도: <span id="current-temp-val">' + Number(config.tInit).toFixed(1) + '</span> °C</div>';
            const newTempValElem = document.getElementById("current-temp-val");

            const width = container.clientWidth || window.innerWidth || 600;
            const height = 480;

            const scene = new THREE.Scene();
            
            let bgColor = 0x181818;
            let gridColor = 0x444444;
            if (config && config.bgTheme === "summer") {
                bgColor = 0x2b1c0c;
                gridColor = 0x885522;
            } else if (config && config.bgTheme === "winter") {
                bgColor = 0x0a1622;
                gridColor = 0x3377aa;
            }
            scene.background = new THREE.Color(bgColor);

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0.8, 7.5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(10, 10, gridColor, 0x333333);
            grid.position.y = -2.2;
            scene.add(grid);

            const tumblerGroup = new THREE.Group();

            const solidMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.9, 0.75, 3.0, 32, 1, false, 0, Math.PI),
                new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, side: THREE.DoubleSide })
            );
            tumblerGroup.add(solidMesh);
